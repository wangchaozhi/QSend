name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            qt-arch: win64_msvc2022_64
          - os: macos-14
            platform: macos-universal
            qt-arch: clang_64
          - os: ubuntu-22.04
            platform: linux-x64
            qt-arch: linux_gcc_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and tag
        id: meta
        run: python scripts/release.py metadata
      - name: Linux build and GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libegl1 \
            libfontconfig1 libfreetype6 libssl3 fonts-noto-cjk
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: true
          aqtversion: '==3.3.0'
      - name: Windows configure, build, test and deploy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -QtPath $env:QT_ROOT_DIR -BuildDir ./build -DeployDir ./package-stage/QSend
          Copy-Item -LiteralPath "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" -Destination ./package-stage/QSend/platforms/
      - name: Unix configure
        if: runner.os != 'Windows'
        run: |
          options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            options+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0')
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_LIBDIR=lib -DQSEND_DEPLOY_RUNTIME=ON "${options[@]}"
      - name: Unix build and test
        if: runner.os != 'Windows'
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --timeout 60
      - name: macOS deploy
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh build package-stage/QSend "$QT_ROOT_DIR"
      - name: Linux deploy
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh build package-stage/QSend "$QT_ROOT_DIR"
      - name: Include notices, examples and build metadata
        run: |
          python scripts/release.py prepare --platform '${{ matrix.platform }}' \
            --stage package-stage/QSend --qt-root "$QT_ROOT_DIR"
      - name: Test deployed app without the Qt SDK
        run: |
          python scripts/ci-smoke.py --platform '${{ matrix.platform }}' \
            --stage package-stage/QSend --qt-root "$QT_ROOT_DIR" --isolate-qt \
            --version '${{ steps.meta.outputs.version }}' --output ci-results
      - name: Archive verified package
        run: |
          python scripts/release.py archive --platform '${{ matrix.platform }}' \
            --stage package-stage/QSend --output artifacts
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            ci-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish verified tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Verify all platform manifests and checksums
        run: |
          python3 scripts/release.py metadata
          python3 scripts/release.py collect --output artifacts
      - name: Create release only after every package is ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/qsend-release.json 2>/dev/null; then
            if [[ "$(python3 -c 'import json; print(json.load(open("/tmp/qsend-release.json"))["isDraft"])')" != True ]]; then
              echo 'Release is already published; published assets are immutable.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "QSend $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.tar.gz \
            artifacts/SHA256SUMS artifacts/build-manifest.json --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > /tmp/qsend-assets.txt
          python3 - <<'PY'
          import pathlib
          expected = {p.name for p in pathlib.Path('artifacts').iterdir()
                      if p.name.endswith(('.zip', '.tar.gz')) or p.name in ('SHA256SUMS', 'build-manifest.json')}
          actual = set(pathlib.Path('/tmp/qsend-assets.txt').read_text().splitlines())
          assert actual == expected, (actual, expected)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
